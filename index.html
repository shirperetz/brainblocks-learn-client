<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- 2026-11-14 (Shir picked B): the dolphin's face on a sea-blue background -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="עולם החשבון" />
    <!-- 2026-11-14 (accessibility): zoom allowed; buttons use touch-action: manipulation instead -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c5cff" />
    <!-- 2026-11-25 (speed check): the Rubik font lives on the site (was Google Fonts - an extra trip that
         held up the first screen, and children's phones contacted Google). One variable file per
         alphabet (weights 400-900), SIL Open Font License; the text shows at once, Rubik swaps in. -->
    <link rel="preload" href="/fonts/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Rubik"; font-style: normal; font-weight: 300 900; font-display: swap;
        src: url(/fonts/rubik-hebrew.woff2) format("woff2");
        unicode-range: U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Rubik"; font-style: normal; font-weight: 300 900; font-display: swap;
        src: url(/fonts/rubik-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    </style>
    <title>עולם החשבון</title>
    <!-- 2026-11-14: what Google and a shared link (WhatsApp / Facebook) show -->
    <meta name="description" content="תרגול חשבון בכיף לכיתות א׳–ו׳: איים, משחקים ושלבים לפי תוכנית הלימודים. חינם, בלי פרסומות. למורים: כיתות, משימות, דוחות וחדר משחק חי." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="עולם החשבון" />
    <meta property="og:locale" content="he_IL" />

    <meta property="og:description" content="איים, משחקים ושלבים לכיתות א׳–ו׳. חינם, בלי פרסומות." />
    <meta property="og:url" content="%PUBLIC_ORIGIN%/" />
    <meta property="og:image" content="%PUBLIC_ORIGIN%/og-image.png" />
